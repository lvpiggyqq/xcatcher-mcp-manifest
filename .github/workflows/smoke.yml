name: Remote MCP smoke

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anonymous-read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test reviewed export conversion
        run: python3 -m unittest tests/test_tweetclaw_to_users.py
      - name: Check Remote MCP discovery and free onboarding
        run: python3 tests/smoke_remote_mcp.py
