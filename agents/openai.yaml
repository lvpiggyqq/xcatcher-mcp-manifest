interface:
  display_name: "Xcatcher X Post Fetcher"
  short_description: "Preflight and fetch recent public X posts by handle"
  default_prompt: "Use $xcatcher to preflight these X handles for free, show the modeled cost before any payment, collect recent public posts through the safest approved path, and report coverage."
dependencies:
  tools:
    - type: "mcp"
      value: "xcatcher"
      description: "Remote MCP for free preflight, synthetic samples, structured X post results, and optional host-mediated x402 access"
      transport: "streamable_http"
      url: "https://xcatcher.top/mcp/"
